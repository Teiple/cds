name: Odin Check

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Odin
        run: |
          git clone --depth=1 https://github.com/odin-lang/Odin.git
          cd Odin
          make release
          echo "$PWD" >> $GITHUB_PATH

      - name: Check syntax
        run: odin check viewer
